<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 90" width="40" height="90">
  <!-- MAGIC WAND (star-tipped, glittery handle) -->
  <!-- Handle -->
  <rect x="16" y="38" width="8" height="50" rx="4" fill="#E8C030"/>
  <!-- Handle gradient band -->
  <rect x="16" y="55" width="8" height="6" rx="0" fill="#C0A020"/>
  <rect x="16" y="68" width="8" height="6" rx="0" fill="#C0A020"/>
  <!-- Star top -->
  <!-- Outer glow -->
  <circle cx="20" cy="20" r="18" fill="#FFE880" opacity="0.2"/>
  <circle cx="20" cy="20" r="12" fill="#FFE880" opacity="0.25"/>
  <!-- Star shape -->
  <polygon points="20,4 23,14 34,14 25,21 28,31 20,24 12,31 15,21 6,14 17,14" fill="#F0C820"/>
  <polygon points="20,8 22,15 29,15 24,19 26,26 20,22 14,26 16,19 11,15 18,15" fill="#FFE880"/>
  <!-- Center gem -->
  <circle cx="20" cy="18" r="5" fill="#FF40A0"/>
  <circle cx="20" cy="17" r="3" fill="#FF80C0"/>
  <circle cx="19" cy="16" r="1.5" fill="white"/>
  <!-- Sparkles around star -->
  <circle cx="5"  cy="10" r="1.5" fill="#FFE880" opacity="0.9"/>
  <circle cx="35" cy="8"  r="1.5" fill="#FFE880" opacity="0.9"/>
  <circle cx="8"  cy="32" r="1.5" fill="#FFE880" opacity="0.8"/>
  <circle cx="32" cy="30" r="1.5" fill="#FFE880" opacity="0.8"/>
</svg>
