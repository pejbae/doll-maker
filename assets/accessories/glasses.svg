<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- ROUND ROSE-TINTED GLASSES -->

  <!-- Tinted lenses -->
  <circle cx="81"  cy="84" r="18" fill="#FFB0C8" opacity="0.45"/>
  <circle cx="119" cy="84" r="18" fill="#FFB0C8" opacity="0.45"/>

  <!-- Lens frames -->
  <circle cx="81"  cy="84" r="18" fill="none" stroke="#FF6090" stroke-width="3"/>
  <circle cx="119" cy="84" r="18" fill="none" stroke="#FF6090" stroke-width="3"/>

  <!-- Nose bridge -->
  <path d="M 99 84 Q 100 80 101 84" fill="none" stroke="#FF6090" stroke-width="3" stroke-linecap="round"/>

  <!-- Temple arms -->
  <line x1="63"  y1="78" x2="44"  y2="76" stroke="#FF6090" stroke-width="3" stroke-linecap="round"/>
  <line x1="137" y1="78" x2="156" y2="76" stroke="#FF6090" stroke-width="3" stroke-linecap="round"/>

  <!-- Lens shine -->
  <circle cx="74"  cy="77" r="4"   fill="white" opacity="0.6"/>
  <circle cx="112" cy="77" r="4"   fill="white" opacity="0.6"/>
  <circle cx="71"  cy="74" r="2"   fill="white" opacity="0.4"/>
  <circle cx="109" cy="74" r="2"   fill="white" opacity="0.4"/>

  <!-- Small heart charm on left temple -->
  <text x="38" y="80" font-size="10" fill="#FF6090">♡</text>
</svg>
