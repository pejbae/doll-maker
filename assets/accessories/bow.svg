<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- GIANT HAIR BOW — classic kawaii oversized ribbon -->

  <!-- Left wing of bow -->
  <path d="M 100 34 Q 76 16 52 24 Q 44 34 52 46 Q 66 54 100 44 Z" fill="#FF80A0"/>
  <!-- Left wing inner crease -->
  <path d="M 100 38 Q 80 24 60 30 Q 54 38 62 46 Q 76 50 100 42 Z" fill="#FF4878" opacity="0.4"/>
  <!-- Left wing highlight -->
  <path d="M 78 20 Q 60 26 58 36" fill="none" stroke="#FFB0C8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Right wing of bow -->
  <path d="M 100 34 Q 124 16 148 24 Q 156 34 148 46 Q 134 54 100 44 Z" fill="#FF80A0"/>
  <!-- Right wing inner crease -->
  <path d="M 100 38 Q 120 24 140 30 Q 146 38 138 46 Q 124 50 100 42 Z" fill="#FF4878" opacity="0.4"/>
  <!-- Right wing highlight -->
  <path d="M 122 20 Q 140 26 142 36" fill="none" stroke="#FFB0C8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Bow knot center -->
  <ellipse cx="100" cy="39" rx="10" ry="11" fill="#FF4878"/>
  <ellipse cx="100" cy="39" rx="6"  ry="7"  fill="#FF80A0"/>

  <!-- Tiny ribbon tails below bow center -->
  <path d="M 94 48 Q 88 56 86 62" fill="none" stroke="#FF80A0" stroke-width="4" stroke-linecap="round"/>
  <path d="M 106 48 Q 112 56 114 62" fill="none" stroke="#FF80A0" stroke-width="4" stroke-linecap="round"/>

  <!-- Small polka dots on bow wings -->
  <circle cx="68"  cy="28" r="3" fill="white" opacity="0.6"/>
  <circle cx="80"  cy="34" r="2" fill="white" opacity="0.5"/>
  <circle cx="72"  cy="40" r="2.5" fill="white" opacity="0.55"/>
  <circle cx="132" cy="28" r="3" fill="white" opacity="0.6"/>
  <circle cx="120" cy="34" r="2" fill="white" opacity="0.5"/>
  <circle cx="128" cy="40" r="2.5" fill="white" opacity="0.55"/>
</svg>
