<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- PINK CAT EARS HEADBAND -->

  <!-- Headband -->
  <path d="M 50 72 Q 100 60 150 72" fill="none" stroke="#E870A0" stroke-width="7" stroke-linecap="round"/>

  <!-- Left ear (triangle) -->
  <polygon points="62,72 50,32 78,54" fill="#FFB0C8"/>
  <!-- Left ear inner (smaller, darker pink) -->
  <polygon points="64,68 54,38 74,56" fill="#FF80A0"/>

  <!-- Right ear -->
  <polygon points="138,72 150,32 122,54" fill="#FFB0C8"/>
  <!-- Right ear inner -->
  <polygon points="136,68 146,38 126,56" fill="#FF80A0"/>

  <!-- Small star on headband -->
  <circle cx="100" cy="68" r="5" fill="#E870A0"/>
  <text x="95" y="72" font-size="8" fill="white">★</text>
</svg>
