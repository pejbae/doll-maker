<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- NECK -->
  <rect x="88" y="128" width="24" height="26" rx="4" fill="#FFE0C8"/>

  <!-- LEFT ARM (shoulder to hand) -->
  <path d="M 60 158 Q 42 172 34 216 Q 40 225 52 222 Q 60 180 74 162 Z" fill="#FFE0C8"/>
  <!-- Right arm -->
  <path d="M 140 158 Q 158 172 166 216 Q 160 225 148 222 Q 140 180 126 162 Z" fill="#FFE0C8"/>

  <!-- LEFT HAND -->
  <ellipse cx="43" cy="220" rx="13" ry="9" fill="#FFE0C8"/>
  <!-- hand knuckle lines -->
  <line x1="36" y1="218" x2="36" y2="224" stroke="#F5C5A0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="43" y1="214" x2="43" y2="222" stroke="#F5C5A0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="50" y1="218" x2="50" y2="224" stroke="#F5C5A0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- RIGHT HAND -->
  <ellipse cx="157" cy="220" rx="13" ry="9" fill="#FFE0C8"/>
  <line x1="150" y1="218" x2="150" y2="224" stroke="#F5C5A0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="157" y1="214" x2="157" y2="222" stroke="#F5C5A0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="164" y1="218" x2="164" y2="224" stroke="#F5C5A0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- BODY / TORSO (base bodysuit in soft lavender) -->
  <path d="
    M 74 152
    Q 62 158 60 158
    Q 58 194 66 228
    L 134 228
    Q 142 194 140 158
    Q 138 158 126 152
    Q 114 160 100 160
    Q 86 160 74 152 Z
  " fill="#EDE0F5"/>

  <!-- Bodysuit neckline highlight -->
  <path d="M 82 152 Q 100 165 118 152" fill="none" stroke="#D4B8EC" stroke-width="2" stroke-linecap="round"/>

  <!-- LEGS (skin tone) -->
  <!-- Left leg -->
  <path d="M 66 227 Q 63 252 66 278 L 96 278 Q 100 252 100 228 Z" fill="#FFE0C8"/>
  <!-- Right leg -->
  <path d="M 134 227 Q 137 252 134 278 L 104 278 Q 100 252 100 228 Z" fill="#FFE0C8"/>
  <!-- Leg separator line hint -->
  <line x1="100" y1="228" x2="100" y2="268" stroke="#F5C5A0" stroke-width="1.5" opacity="0.5"/>

  <!-- LEFT SHOE (mary-jane style) -->
  <rect x="60" y="264" width="38" height="14" rx="7" fill="#C880E0"/>
  <ellipse cx="79" cy="278" rx="22" ry="8" fill="#C880E0"/>
  <ellipse cx="79" cy="278" rx="14" ry="5" fill="#D8A0F0"/>
  <!-- strap -->
  <rect x="63" y="266" width="28" height="4" rx="2" fill="#A860C8"/>

  <!-- RIGHT SHOE -->
  <rect x="102" y="264" width="38" height="14" rx="7" fill="#C880E0"/>
  <ellipse cx="121" cy="278" rx="22" ry="8" fill="#C880E0"/>
  <ellipse cx="121" cy="278" rx="14" ry="5" fill="#D8A0F0"/>
  <rect x="109" y="266" width="28" height="4" rx="2" fill="#A860C8"/>
</svg>
