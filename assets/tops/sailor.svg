<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- SAILOR UNIFORM TOP — white body, navy collar, pink bow -->

  <!-- Arms (white sleeves) -->
  <path d="M 60 158 Q 42 172 36 215 Q 42 224 52 222 Q 60 180 74 162 Z" fill="white"/>
  <path d="M 140 158 Q 158 172 164 215 Q 158 224 148 222 Q 140 180 126 162 Z" fill="white"/>

  <!-- Sleeve cuffs (navy) -->
  <path d="M 36 208 Q 38 220 52 222 Q 56 210 46 206 Z" fill="#2A3070"/>
  <path d="M 164 208 Q 162 220 148 222 Q 144 210 154 206 Z" fill="#2A3070"/>

  <!-- Main shirt body -->
  <path d="M 74 152 Q 62 158 60 158 Q 58 200 66 228 L 134 228 Q 142 200 140 158 Q 138 158 126 152 Q 114 162 100 162 Q 86 162 74 152 Z" fill="white"/>

  <!-- Sailor collar — navy blue, square back -->
  <!-- Collar back piece (wide V shape) -->
  <path d="M 68 148 Q 72 158 100 172 Q 128 158 132 148 Q 100 140 68 148 Z" fill="#2A3070"/>
  <!-- Collar border white stripe -->
  <path d="M 70 152 Q 74 161 100 174 Q 126 161 130 152 Q 100 144 70 152 Z" fill="white" opacity="0"/>
  <!-- Collar left panel going up to neck -->
  <path d="M 68 148 L 76 130 L 88 130 L 100 172 Q 72 160 68 148 Z" fill="#2A3070"/>
  <!-- Collar right panel -->
  <path d="M 132 148 L 124 130 L 112 130 L 100 172 Q 128 160 132 148 Z" fill="#2A3070"/>
  <!-- White stripe on collar edge -->
  <path d="M 70 149 L 78 132" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 130 149 L 122 132" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 68 149 Q 100 174 132 149" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pink bow at collar center -->
  <!-- Left bow wing -->
  <path d="M 88 170 Q 80 162 82 172 Q 84 182 92 178 Q 96 174 88 170 Z" fill="#FF80A0"/>
  <!-- Right bow wing -->
  <path d="M 112 170 Q 120 162 118 172 Q 116 182 108 178 Q 104 174 112 170 Z" fill="#FF80A0"/>
  <!-- Bow center knot -->
  <ellipse cx="100" cy="174" rx="6" ry="6" fill="#FF5080"/>
  <!-- Bow tails -->
  <path d="M 96 178 Q 92 186 90 192" fill="none" stroke="#FF80A0" stroke-width="4" stroke-linecap="round"/>
  <path d="M 104 178 Q 108 186 110 192" fill="none" stroke="#FF80A0" stroke-width="4" stroke-linecap="round"/>

  <!-- Button line on shirt -->
  <circle cx="100" cy="210" r="2.5" fill="#DDE0F0"/>
  <circle cx="100" cy="220" r="2.5" fill="#DDE0F0"/>
</svg>
