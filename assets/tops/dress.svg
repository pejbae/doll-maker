  <circle cx="35" cy="35" r="2" fill="#E080FF" opacity="0.8"/>
  <circle cx="50" cy="42" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="30" cy="48" r="1.5" fill="#E080FF" opacity="0.8"/>
  <circle cx="55" cy="32" r="2" fill="white" opacity="0.7"/>
  <circle cx="28" cy="78" r="2" fill="#E080FF" opacity="0.7"/>
  <circle cx="55" cy="85" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="41" cy="92" r="2" fill="#E080FF" opacity="0.7"/>
  <!-- Center waist detail -->
  <path d="M 33 56 Q 41 60 49 56" fill="none" stroke="#6A00A0" stroke-width="2"/>
</svg>
