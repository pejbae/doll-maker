  <!-- Hem -->
  <path d="M 22 46 Q 40 50 58 46" fill="none" stroke="#60C020" stroke-width="2"/>
  <!-- Pattern (star/daisy motifs) -->
  <circle cx="36" cy="32" r="5" fill="#60C020"/>
  <circle cx="36" cy="32" r="3" fill="#80D040"/>
  <circle cx="36" cy="32" r="1.5" fill="#A0F060"/>
  <circle cx="50" cy="36" r="4" fill="#60C020"/>
