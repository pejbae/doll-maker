<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- SWEET LOLITA DRESS — pink bodice, full poofy skirt, lace details -->

  <!-- Sleeves (puffed, pink) -->
  <path d="M 60 158 Q 36 166 30 215 Q 38 226 52 222 Q 58 180 72 162 Z" fill="#FFB0C8"/>
  <path d="M 140 158 Q 164 166 170 215 Q 162 226 148 222 Q 142 180 128 162 Z" fill="#FFB0C8"/>

  <!-- Sleeve puffs at shoulder -->
  <ellipse cx="58"  cy="156" rx="16" ry="12" fill="#FFC8D8"/>
  <ellipse cx="142" cy="156" rx="16" ry="12" fill="#FFC8D8"/>

  <!-- Sleeve lace trim -->
  <path d="M 30 215 Q 38 226 52 222" fill="none" stroke="white" stroke-width="3" stroke-dasharray="4,3" stroke-linecap="round"/>
  <path d="M 170 215 Q 162 226 148 222" fill="none" stroke="white" stroke-width="3" stroke-dasharray="4,3" stroke-linecap="round"/>

  <!-- Bodice -->
  <path d="M 74 152 Q 62 160 60 162 Q 58 192 68 200 L 132 200 Q 142 192 140 162 Q 138 160 126 152 Q 114 162 100 162 Q 86 162 74 152 Z" fill="#FF90B8"/>

  <!-- Bodice lace center panel -->
  <rect x="90" y="158" width="20" height="38" rx="4" fill="#FFD0E4" opacity="0.7"/>
  <!-- Lace pattern on panel -->
  <line x1="90" y1="162" x2="110" y2="162" stroke="white" stroke-width="1" opacity="0.7"/>
  <line x1="90" y1="167" x2="110" y2="167" stroke="white" stroke-width="1" opacity="0.7"/>
  <line x1="90" y1="172" x2="110" y2="172" stroke="white" stroke-width="1" opacity="0.7"/>
  <line x1="90" y1="177" x2="110" y2="177" stroke="white" stroke-width="1" opacity="0.7"/>
  <line x1="90" y1="182" x2="110" y2="182" stroke="white" stroke-width="1" opacity="0.7"/>
  <line x1="90" y1="187" x2="110" y2="187" stroke="white" stroke-width="1" opacity="0.7"/>
  <line x1="90" y1="192" x2="110" y2="192" stroke="white" stroke-width="1" opacity="0.7"/>

  <!-- Bodice bow at center top -->
  <path d="M 88 160 Q 82 154 84 162 Q 86 170 94 166 Q 98 162 88 160 Z" fill="#FF5088"/>
  <path d="M 112 160 Q 118 154 116 162 Q 114 170 106 166 Q 102 162 112 160 Z" fill="#FF5088"/>
  <ellipse cx="100" cy="163" rx="5" ry="5" fill="#FF2060"/>

  <!-- Waist ribbon -->
  <rect x="66" y="196" width="68" height="6" rx="3" fill="#FF5088"/>

  <!-- SKIRT — poofy tiered -->
  <!-- Tier 1 (top) -->
  <path d="M 64 200 Q 100 215 136 200 L 145 228 Q 100 242 55 228 Z" fill="#FFB0C8"/>
  <!-- Tier 2 (middle) -->
  <path d="M 52 228 Q 100 246 148 228 L 154 255 Q 100 272 46 255 Z" fill="#FF90B8"/>
  <!-- Tier 3 (bottom ruffle) -->
  <path d="M 44 254 Q 100 272 156 254 L 158 270 Q 100 282 42 270 Z" fill="#FFB0C8"/>

  <!-- Lace trim on each tier -->
  <!-- Tier 1 lace -->
  <path d="M 55 228 Q 100 244 145 228" fill="none" stroke="white" stroke-width="3" stroke-dasharray="5,4"/>
  <!-- Tier 2 lace -->
  <path d="M 46 255 Q 100 272 154 255" fill="none" stroke="white" stroke-width="3" stroke-dasharray="5,4"/>
  <!-- Tier 3 lace -->
  <path d="M 42 270 Q 100 283 158 270" fill="none" stroke="white" stroke-width="3" stroke-dasharray="5,4"/>

  <!-- Small hearts on skirt -->
  <text x="82" y="240" font-size="10" fill="#FF5088" opacity="0.7">♡</text>
  <text x="106" y="248" font-size="10" fill="#FF5088" opacity="0.7">♡</text>
  <text x="72"  y="260" font-size="10" fill="#FF5088" opacity="0.7">♡</text>
  <text x="116" y="262" font-size="10" fill="#FF5088" opacity="0.7">♡</text>
</svg>
