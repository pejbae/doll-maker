<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 30" width="80" height="30">
  <!-- CHUNKY SNEAKERS (white with pink stripe) -->
  <!-- Left sneaker body -->
  <path d="M 4 10 Q 4 4 10 4 L 30 4 Q 36 4 36 8 L 36 20 Q 30 22 16 22 L 4 20 Z" fill="white" stroke="#E0E0E0" stroke-width="0.5"/>
  <!-- Left sole -->
  <rect x="2"  y="18" width="36" height="8"  rx="3" fill="#E0E0E0"/>
  <!-- Pink swoosh/stripe left -->
  <path d="M 8 6 Q 22 10 34 8" fill="none" stroke="#FF69B4" stroke-width="3" stroke-linecap="round"/>
  <!-- Laces left -->
  <line x1="10" y1="8"  x2="28" y2="8"  stroke="#DDD" stroke-width="1"/>
  <line x1="10" y1="11" x2="28" y2="11" stroke="#DDD" stroke-width="1"/>
  <line x1="10" y1="14" x2="28" y2="14" stroke="#DDD" stroke-width="1"/>

  <!-- Right sneaker body -->
  <path d="M 44 10 Q 44 4 50 4 L 70 4 Q 76 4 76 8 L 76 20 Q 70 22 56 22 L 44 20 Z" fill="white" stroke="#E0E0E0" stroke-width="0.5"/>
  <!-- Right sole -->
  <rect x="42" y="18" width="36" height="8"  rx="3" fill="#E0E0E0"/>
  <!-- Pink swoosh right -->
  <path d="M 48 6 Q 62 10 74 8" fill="none" stroke="#FF69B4" stroke-width="3" stroke-linecap="round"/>
  <!-- Laces right -->
  <line x1="50" y1="8"  x2="68" y2="8"  stroke="#DDD" stroke-width="1"/>
  <line x1="50" y1="11" x2="68" y2="11" stroke="#DDD" stroke-width="1"/>
  <line x1="50" y1="14" x2="68" y2="14" stroke="#DDD" stroke-width="1"/>
</svg>
