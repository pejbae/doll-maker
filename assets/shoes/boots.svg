<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 75" width="80" height="75">
  <!-- KNEE-HIGH BOOTS (white, Y2K) -->
  <!-- Left boot shaft -->
  <rect x="6"  y="2"  width="24" height="50" rx="6" fill="#F0F0F0"/>
  <!-- Left boot foot -->
  <path d="M 4 50 Q 4 58 6 64 L 32 64 Q 36 58 36 50 Z" fill="#E0E0E0"/>
  <ellipse cx="20" cy="64" rx="14" ry="5" fill="#E0E0E0"/>
  <!-- Boot stitching / panel line left -->
  <line x1="18" y1="2" x2="18" y2="52" stroke="#D0D0D0" stroke-width="1"/>
  <!-- Boot top trim left -->
  <rect x="4" y="48" width="28" height="5" rx="2" fill="#D0D0D0"/>
  <!-- Zipper left -->
  <line x1="24" y1="6" x2="24" y2="50" stroke="#C0C0C0" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Right boot shaft -->
  <rect x="50" y="2"  width="24" height="50" rx="6" fill="#F0F0F0"/>
  <!-- Right boot foot -->
  <path d="M 48 50 Q 48 58 50 64 L 76 64 Q 80 58 80 50 Z" fill="#E0E0E0"/>
  <ellipse cx="62" cy="64" rx="14" ry="5" fill="#E0E0E0"/>
  <line x1="60" y1="2" x2="60" y2="52" stroke="#D0D0D0" stroke-width="1"/>
  <rect x="48" y="48" width="28" height="5" rx="2" fill="#D0D0D0"/>
  <line x1="56" y1="6" x2="56" y2="50" stroke="#C0C0C0" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
