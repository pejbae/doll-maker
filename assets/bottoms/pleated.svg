<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- PINK PLAID PLEATED MINI SKIRT -->

  <!-- Waistband -->
  <rect x="64" y="220" width="72" height="10" rx="4" fill="#FF6090"/>

  <!-- Skirt body — pleated, flows outward -->
  <path d="M 64 228 Q 44 240 42 265 L 158 265 Q 156 240 136 228 Z" fill="#FFB0C8"/>

  <!-- Plaid lines — horizontal -->
  <line x1="42" y1="237" x2="158" y2="237" stroke="#FF6090" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="246" x2="160" y2="246" stroke="#FF6090" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="255" x2="160" y2="255" stroke="#FF6090" stroke-width="2" opacity="0.5"/>
  <!-- Plaid lines — vertical (diagonal pleats) -->
  <line x1="60"  y1="228" x2="50"  y2="265" stroke="#FF6090" stroke-width="1.5" opacity="0.4"/>
  <line x1="72"  y1="228" x2="63"  y2="265" stroke="#FF6090" stroke-width="1.5" opacity="0.4"/>
  <line x1="84"  y1="228" x2="76"  y2="265" stroke="#FF6090" stroke-width="1.5" opacity="0.4"/>
  <line x1="96"  y1="228" x2="88"  y2="265" stroke="#FF6090" stroke-width="1.5" opacity="0.4"/>
  <line x1="108" y1="228" x2="100" y2="265" stroke="#FF6090" stroke-width="1.5" opacity="0.4"/>
  <line x1="120" y1="228" x2="112" y2="265" stroke="#FF6090" stroke-width="1.5" opacity="0.4"/>
  <line x1="132" y1="228" x2="124" y2="265" stroke="#FF6090" stroke-width="1.5" opacity="0.4"/>
  <line x1="140" y1="228" x2="150" y2="265" stroke="#FF6090" stroke-width="1.5" opacity="0.4"/>

  <!-- Plaid cross-lines (cream/white on top of pink) -->
  <line x1="42" y1="241" x2="158" y2="241" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="250" x2="160" y2="250" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="259" x2="160" y2="259" stroke="white" stroke-width="1" opacity="0.4"/>

  <!-- Pleat fold highlights -->
  <line x1="66"  y1="228" x2="56"  y2="265" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="90"  y1="228" x2="80"  y2="265" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="110" y1="228" x2="104" y2="265" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="134" y1="228" x2="144" y2="265" stroke="white" stroke-width="1.5" opacity="0.35"/>

  <!-- Bottom hem -->
  <rect x="40" y="262" width="120" height="5" rx="2" fill="#FF6090"/>

  <!-- Tiny bow on waistband -->
  <path d="M 92 221 Q 88 218 90 222 Q 92 226 96 224 Q 98 222 92 221 Z" fill="white"/>
  <path d="M 108 221 Q 112 218 110 222 Q 108 226 104 224 Q 102 222 108 221 Z" fill="white"/>
  <circle cx="100" cy="222" r="3" fill="#FF6090"/>
</svg>
