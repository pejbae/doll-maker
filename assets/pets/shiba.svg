<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- SHIBA INU PUPPY — sitting cute, cream and tan -->

  <!-- Tail (curled over back) -->
  <path d="M 66 240 Q 72 222 64 216 Q 56 212 52 220 Q 50 228 58 232 Q 64 234 66 240 Z" fill="#D08040"/>
  <path d="M 64 238 Q 70 224 62 218 Q 56 214 54 222 Q 52 230 60 232 Z" fill="#E8A860" opacity="0.5"/>

  <!-- Body -->
  <ellipse cx="44" cy="254" rx="26" ry="20" fill="#D08040"/>
  <!-- Cream belly -->
  <ellipse cx="44" cy="252" rx="16" ry="12" fill="#F0D898"/>

  <!-- Front legs/paws -->
  <rect x="28" y="266" width="14" height="8" rx="4" fill="#D08040"/>
  <rect x="52" y="266" width="14" height="8" rx="4" fill="#D08040"/>
  <!-- Paw toes -->
  <circle cx="31" cy="273" r="3" fill="#C07030"/>
  <circle cx="36" cy="273" r="3" fill="#C07030"/>
  <circle cx="55" cy="273" r="3" fill="#C07030"/>
  <circle cx="60" cy="273" r="3" fill="#C07030"/>

  <!-- Head -->
  <ellipse cx="46" cy="228" rx="24" ry="22" fill="#D08040"/>

  <!-- Face cream markings -->
  <ellipse cx="46" cy="232" rx="16" ry="12" fill="#F0D898"/>

  <!-- Ears (pricked up, pointed) -->
  <!-- Left ear -->
  <polygon points="28,216 22,196 38,210" fill="#D08040"/>
  <polygon points="30,214 26,200 36,210" fill="#C06030" opacity="0.5"/>
  <!-- Right ear -->
  <polygon points="64,216 70,196 54,210" fill="#D08040"/>
  <polygon points="62,214 66,200 56,210" fill="#C06030" opacity="0.5"/>

  <!-- Eyes (dark, bright) -->
  <ellipse cx="40" cy="226" rx="6" ry="6.5" fill="#2A1010"/>
  <circle  cx="42" cy="223" r="2" fill="white"/>
  <ellipse cx="52" cy="226" rx="6" ry="6.5" fill="#2A1010"/>
  <circle  cx="54" cy="223" r="2" fill="white"/>

  <!-- Cute white eye dot extra -->
  <circle cx="38" cy="226" r="1" fill="white" opacity="0.5"/>
  <circle cx="50" cy="226" r="1" fill="white" opacity="0.5"/>

  <!-- Nose -->
  <ellipse cx="46" cy="234" rx="6" ry="4" fill="#402010"/>
  <circle  cx="45" cy="233" r="1.5" fill="#6A3020" opacity="0.5"/>

  <!-- Mouth / muzzle area -->
  <path d="M 43 238 Q 46 242 49 238" fill="none" stroke="#A05030" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Blush on cheeks -->
  <ellipse cx="34" cy="234" rx="7" ry="4" fill="#FFB7C5" opacity="0.5"/>
  <ellipse cx="58" cy="234" rx="7" ry="4" fill="#FFB7C5" opacity="0.5"/>

  <!-- Eyebrow markings (tan pips above eyes) -->
  <ellipse cx="40" cy="218" rx="5" ry="3" fill="#E8C070" opacity="0.7"/>
  <ellipse cx="52" cy="218" rx="5" ry="3" fill="#E8C070" opacity="0.7"/>

  <!-- Tiny star on collar area -->
  <text x="38" y="248" font-size="8" fill="#FFB7C5">♡</text>
</svg>
