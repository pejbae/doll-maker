<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 65 55" width="65" height="55">
  <!-- SMALL FLUFFY DOG (white poodle-ish) -->
  <!-- Tail (curled up) -->
  <path d="M 50 36 Q 60 28 58 22 Q 56 18 52 20 Q 50 24 52 28 Q 54 32 50 36 Z" fill="#F5F5F5"/>
  <!-- Body (fluffy oval) -->
  <ellipse cx="30" cy="40" rx="22" ry="15" fill="#F5F5F5"/>
  <!-- Body fur texture circles -->
  <circle cx="14" cy="36" r="5" fill="white"/>
  <circle cx="22" cy="32" r="5" fill="white"/>
  <circle cx="36" cy="32" r="5" fill="white"/>
  <circle cx="44" cy="36" r="5" fill="white"/>
  <circle cx="30" cy="34" r="5" fill="white"/>
  <!-- Front legs -->
  <ellipse cx="20" cy="52" rx="7" ry="4" fill="#F5F5F5"/>
  <ellipse cx="40" cy="52" rx="7" ry="4" fill="#F5F5F5"/>
  <!-- Toe lines -->
  <line x1="17" y1="53" x2="16" y2="55" stroke="#DDD" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="54" x2="20" y2="55" stroke="#DDD" stroke-width="1" stroke-linecap="round"/>
  <line x1="23" y1="53" x2="24" y2="55" stroke="#DDD" stroke-width="1" stroke-linecap="round"/>
  <line x1="37" y1="53" x2="36" y2="55" stroke="#DDD" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="54" x2="40" y2="55" stroke="#DDD" stroke-width="1" stroke-linecap="round"/>
  <line x1="43" y1="53" x2="44" y2="55" stroke="#DDD" stroke-width="1" stroke-linecap="round"/>
  <!-- Head (fluffy) -->
  <circle cx="30" cy="20" r="17" fill="#F5F5F5"/>
  <!-- Fluffy head circles -->
  <circle cx="16" cy="16" r="6" fill="white"/>
  <circle cx="44" cy="16" r="6" fill="white"/>
  <circle cx="24" cy="10" r="6" fill="white"/>
  <circle cx="36" cy="10" r="6" fill="white"/>
  <!-- Floppy ears -->
  <ellipse cx="14" cy="24" rx="6"  ry="10" fill="#E8D8A0" transform="rotate(-15 14 24)"/>
  <ellipse cx="46" cy="24" rx="6"  ry="10" fill="#E8D8A0" transform="rotate(15 46 24)"/>
  <!-- Eyes (brown) -->
  <circle cx="24" cy="20" r="5"   fill="#4A2010"/>
  <circle cx="24" cy="20" r="3"   fill="#1A0A00"/>
  <circle cx="25" cy="18" r="1.5" fill="white"/>
  <circle cx="36" cy="20" r="5"   fill="#4A2010"/>
  <circle cx="36" cy="20" r="3"   fill="#1A0A00"/>
  <circle cx="37" cy="18" r="1.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="30" cy="26" rx="3.5" ry="2.5" fill="#2A0A00"/>
  <!-- Mouth -->
  <path d="M 27 29 Q 30 32 33 29" fill="none" stroke="#6A3010" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Tongue -->
  <ellipse cx="30" cy="32" rx="2.5" ry="2" fill="#FF8090"/>
  <!-- Blush -->
  <ellipse cx="19" cy="26" rx="5" ry="3" fill="#FFB7C5" opacity="0.5"/>
  <ellipse cx="41" cy="26" rx="5" ry="3" fill="#FFB7C5" opacity="0.5"/>
</svg>
