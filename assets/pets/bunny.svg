<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- WHITE BUNNY — sitting at lower left, with big ears -->

  <!-- Long left ear -->
  <ellipse cx="34" cy="204" rx="9" ry="28" fill="white"/>
  <ellipse cx="34" cy="204" rx="5" ry="22" fill="#FFD0DC"/>

  <!-- Long right ear (slightly tilted) -->
  <ellipse cx="52" cy="200" rx="9" ry="28" transform="rotate(-10 52 200)" fill="white"/>
  <ellipse cx="52" cy="200" rx="5" ry="22" transform="rotate(-10 52 200)" fill="#FFD0DC"/>

  <!-- Body -->
  <ellipse cx="46" cy="256" rx="28" ry="22" fill="white"/>
  <!-- Belly tuft (fluffier chest) -->
  <ellipse cx="46" cy="248" rx="16" ry="12" fill="#F8F8FF"/>

  <!-- Front paws -->
  <ellipse cx="30" cy="274" rx="10" ry="6" fill="white"/>
  <ellipse cx="56" cy="274" rx="10" ry="6" fill="white"/>
  <!-- Toe lines -->
  <line x1="26" y1="276" x2="26" y2="280" stroke="#E0C0C8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="277" x2="30" y2="280" stroke="#E0C0C8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="276" x2="34" y2="280" stroke="#E0C0C8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="276" x2="52" y2="280" stroke="#E0C0C8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="277" x2="56" y2="280" stroke="#E0C0C8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="276" x2="60" y2="280" stroke="#E0C0C8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="48" cy="230" r="22" fill="white"/>

  <!-- Puffy cheeks -->
  <ellipse cx="36" cy="236" rx="10" ry="7" fill="#F8F8FF"/>
  <ellipse cx="60" cy="236" rx="10" ry="7" fill="#F8F8FF"/>

  <!-- Eyes (dark round) -->
  <circle cx="40" cy="228" r="6"   fill="#4A2060"/>
  <circle cx="40" cy="228" r="3.5" fill="#2A0840"/>
  <circle cx="42" cy="225" r="2"   fill="white"/>
  <circle cx="56" cy="228" r="6"   fill="#4A2060"/>
  <circle cx="56" cy="228" r="3.5" fill="#2A0840"/>
  <circle cx="58" cy="225" r="2"   fill="white"/>

  <!-- Nose (pink triangle) -->
  <polygon points="48,234 45,238 51,238" fill="#FFB0C0"/>
  <!-- Mouth -->
  <path d="M 45 238 Q 48 242 51 238" fill="none" stroke="#E88090" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="36" cy="238" rx="8" ry="5" fill="#FFB7C5" opacity="0.55"/>
  <ellipse cx="60" cy="238" rx="8" ry="5" fill="#FFB7C5" opacity="0.55"/>

  <!-- Cotton tail -->
  <circle cx="70" cy="260" r="8" fill="white"/>
  <circle cx="70" cy="260" r="5" fill="#F8F8FF"/>

  <!-- Cute tiny carrot held in paw -->
  <rect x="14" y="264" width="5" height="12" rx="2" fill="#FF8030" transform="rotate(-20 14 264)"/>
  <path d="M 14 264 Q 10 258 16 260" fill="#60B830" transform="rotate(-20 14 264)"/>
  <path d="M 16 264 Q 12 257 18 259" fill="#60B830" transform="rotate(-20 14 264)"/>
</svg>
