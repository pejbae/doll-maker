<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 65 55" width="65" height="55">
  <!-- SITTING CAT (white, big eyes) -->
  <!-- Tail -->
  <path d="M 50 50 Q 60 42 62 34 Q 64 28 58 26 Q 54 28 56 34 Q 58 40 50 46 Z" fill="#E8E8F0"/>
  <!-- Body -->
  <ellipse cx="30" cy="40" rx="22" ry="14" fill="#E8E8F0"/>
  <!-- Front paws -->
  <ellipse cx="20" cy="52" rx="8" ry="4" fill="#E8E8F0"/>
  <ellipse cx="38" cy="52" rx="8" ry="4" fill="#E8E8F0"/>
  <!-- Paw toe lines -->
  <line x1="17" y1="53" x2="16" y2="55" stroke="#C0C0D0" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="54" x2="20" y2="55" stroke="#C0C0D0" stroke-width="1" stroke-linecap="round"/>
  <line x1="23" y1="53" x2="24" y2="55" stroke="#C0C0D0" stroke-width="1" stroke-linecap="round"/>
  <line x1="35" y1="53" x2="34" y2="55" stroke="#C0C0D0" stroke-width="1" stroke-linecap="round"/>
  <line x1="38" y1="54" x2="38" y2="55" stroke="#C0C0D0" stroke-width="1" stroke-linecap="round"/>
  <line x1="41" y1="53" x2="42" y2="55" stroke="#C0C0D0" stroke-width="1" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="30" cy="22" r="18" fill="#E8E8F0"/>
  <!-- Ears -->
  <polygon points="16,10 10,2 22,8"  fill="#E8E8F0"/>
  <polygon points="17,10 12,4 22,9"  fill="#FFC0C8" opacity="0.7"/>
  <polygon points="44,10 50,2 38,8"  fill="#E8E8F0"/>
  <polygon points="43,10 48,4 38,9"  fill="#FFC0C8" opacity="0.7"/>
  <!-- Eyes (big blue) -->
  <circle cx="23" cy="22" r="7"   fill="#60A8FF"/>
  <circle cx="23" cy="22" r="4.5" fill="#1A4080"/>
  <circle cx="25" cy="19" r="2"   fill="white"/>
  <circle cx="37" cy="22" r="7"   fill="#60A8FF"/>
  <circle cx="37" cy="22" r="4.5" fill="#1A4080"/>
  <circle cx="39" cy="19" r="2"   fill="white"/>
  <!-- Nose -->
  <polygon points="30,28 28,32 32,32" fill="#FFC0C8"/>
  <!-- Mouth -->
  <path d="M 28 32 Q 30 36 32 32" fill="none" stroke="#D09090" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="22" y1="30" x2="4"  y2="27" stroke="#C0C0D0" stroke-width="1"/>
  <line x1="22" y1="32" x2="4"  y2="32" stroke="#C0C0D0" stroke-width="1"/>
  <line x1="38" y1="30" x2="56" y2="27" stroke="#C0C0D0" stroke-width="1"/>
  <line x1="38" y1="32" x2="56" y2="32" stroke="#C0C0D0" stroke-width="1"/>
  <!-- Pink bow collar -->
  <path d="M 16 34 Q 30 38 44 34 Q 30 32 16 34 Z" fill="#FF69B4"/>
  <path d="M 24 33 Q 22 30 24 34 Q 26 37 30 35 Q 32 33 24 33 Z" fill="#E0005A"/>
  <path d="M 36 33 Q 38 30 36 34 Q 34 37 30 35 Q 28 33 36 33 Z" fill="#E0005A"/>
  <circle cx="30" cy="35" r="2.5" fill="#CC0050"/>
</svg>
