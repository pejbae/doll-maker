<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <!-- LONG STRAIGHT BROWN HAIR -->
  <!-- Back hair falls behind body -->
  <rect x="22" y="8" width="36" height="92" rx="6" fill="#5C3010"/>
  <!-- Side strands -->
  <rect x="14" y="12" width="12" height="90" rx="5" fill="#5C3010"/>
  <rect x="54" y="12" width="12" height="90" rx="5" fill="#5C3010"/>
  <!-- Crown/top -->
  <ellipse cx="40" cy="12" rx="22" ry="12" fill="#5C3010"/>
  <!-- Front fringe (bangs) — covers forehead -->
  <path d="M 18 8 Q 40 2 62 8 Q 58 22 50 24 Q 40 26 30 24 Q 22 22 18 8 Z" fill="#5C3010"/>
  <!-- Highlight streak -->
  <path d="M 34 4 Q 36 20 34 40" fill="none" stroke="#8B5C2A" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M 40 2 Q 42 18 40 38" fill="none" stroke="#8B5C2A" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
