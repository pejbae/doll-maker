<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- DARK BROWN SPACE BUNS / ODANGO -->

  <!-- Main head hair mass -->
  <ellipse cx="100" cy="72" rx="62" ry="62" fill="#3A2010"/>

  <!-- Bun left (odango) -->
  <circle cx="68"  cy="22" r="22" fill="#3A2010"/>
  <circle cx="68"  cy="22" r="17" fill="#4A2C18"/>
  <!-- Bun highlight left -->
  <circle cx="62"  cy="16" r="6"  fill="#6A4028" opacity="0.7"/>
  <circle cx="60"  cy="14" r="3"  fill="#8A6040" opacity="0.5"/>

  <!-- Bun right -->
  <circle cx="132" cy="22" r="22" fill="#3A2010"/>
  <circle cx="132" cy="22" r="17" fill="#4A2C18"/>
  <!-- Bun highlight right -->
  <circle cx="126" cy="16" r="6"  fill="#6A4028" opacity="0.7"/>
  <circle cx="124" cy="14" r="3"  fill="#8A6040" opacity="0.5"/>

  <!-- Bun connectors (hair wound around) -->
  <ellipse cx="68"  cy="40" rx="16" ry="6" fill="#3A2010"/>
  <ellipse cx="132" cy="40" rx="16" ry="6" fill="#3A2010"/>

  <!-- Hair ties / scrunchies on buns -->
  <ellipse cx="68"  cy="22" rx="23" ry="5" fill="none" stroke="#FF80A0" stroke-width="4"/>
  <ellipse cx="132" cy="22" rx="23" ry="5" fill="none" stroke="#FF80A0" stroke-width="4"/>

  <!-- Side hair framing face -->
  <path d="M 44 80 Q 40 104 44 128 Q 52 136 62 130 Q 58 108 56 86 Z" fill="#3A2010"/>
  <path d="M 156 80 Q 160 104 156 128 Q 148 136 138 130 Q 142 108 144 86 Z" fill="#3A2010"/>

  <!-- Bangs — straight across with slight arc -->
  <path d="M 48 46 Q 64 28 100 24 Q 136 24 152 44 Q 136 58 118 58 Q 94 60 70 60 Q 58 62 50 70 Q 44 62 48 46 Z" fill="#3A2010"/>

  <!-- Bangs detail / inner highlights -->
  <path d="M 60 54 Q 84 40 118 40 Q 138 44 150 52 Q 134 62 114 62 Q 86 64 64 68 Z" fill="#4A2C18" opacity="0.55"/>

  <!-- Shine/highlight on main hair mass -->
  <path d="M 74 36 Q 78 52 74 70" fill="none" stroke="#6A4028" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 98 34 Q 100 48 100 66" fill="none" stroke="#6A4028" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
