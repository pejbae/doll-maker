<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- MINT CURLY HAIR — big voluminous ringlets -->

  <!-- Left curly side mass -->
  <ellipse cx="38"  cy="90"  rx="20" ry="26" fill="#72C5A8"/>
  <ellipse cx="32"  cy="116" rx="18" ry="22" fill="#5AB898"/>
  <ellipse cx="36"  cy="140" rx="16" ry="18" fill="#72C5A8"/>
  <ellipse cx="42"  cy="160" rx="14" ry="16" fill="#5AB898"/>

  <!-- Right curly side mass -->
  <ellipse cx="162" cy="90"  rx="20" ry="26" fill="#72C5A8"/>
  <ellipse cx="168" cy="116" rx="18" ry="22" fill="#5AB898"/>
  <ellipse cx="164" cy="140" rx="16" ry="18" fill="#72C5A8"/>
  <ellipse cx="158" cy="160" rx="14" ry="16" fill="#5AB898"/>

  <!-- Top crown extra volume -->
  <ellipse cx="72"  cy="12"  rx="18" ry="14" fill="#72C5A8"/>
  <ellipse cx="100" cy="10"  rx="18" ry="14" fill="#5AB898"/>
  <ellipse cx="128" cy="12"  rx="18" ry="14" fill="#72C5A8"/>

  <!-- Main head hair mass -->
  <ellipse cx="100" cy="62" rx="65" ry="60" fill="#72C5A8"/>

  <!-- Fringe curls -->
  <ellipse cx="62"  cy="46" rx="16" ry="14" fill="#5AB898"/>
  <ellipse cx="84"  cy="36" rx="15" ry="14" fill="#72C5A8"/>
  <ellipse cx="108" cy="34" rx="15" ry="14" fill="#5AB898"/>
  <ellipse cx="130" cy="38" rx="15" ry="14" fill="#72C5A8"/>
  <ellipse cx="148" cy="50" rx="14" ry="12" fill="#5AB898"/>

  <!-- Individual curl spirals (small circles for texture) -->
  <circle cx="52"  cy="52"  r="8"  fill="#5AB898" opacity="0.6"/>
  <circle cx="72"  cy="38"  r="7"  fill="#8ADED2" opacity="0.5"/>
  <circle cx="100" cy="28"  r="8"  fill="#5AB898" opacity="0.6"/>
  <circle cx="128" cy="36"  r="7"  fill="#8ADED2" opacity="0.5"/>
  <circle cx="146" cy="50"  r="8"  fill="#5AB898" opacity="0.6"/>

  <!-- Side face-framing curls -->
  <path d="M 44 82 Q 40 106 44 128 Q 52 136 60 130 Q 56 108 56 86 Z" fill="#5AB898"/>
  <path d="M 156 82 Q 160 106 156 128 Q 148 136 140 130 Q 144 108 144 86 Z" fill="#5AB898"/>

  <!-- Highlights on curls -->
  <circle cx="40"  cy="84"  r="5"  fill="#B5EAD7" opacity="0.5"/>
  <circle cx="160" cy="84"  r="5"  fill="#B5EAD7" opacity="0.5"/>
  <circle cx="76"  cy="18"  r="5"  fill="#B5EAD7" opacity="0.6"/>
  <circle cx="100" cy="14"  r="5"  fill="#B5EAD7" opacity="0.6"/>
  <circle cx="124" cy="18"  r="5"  fill="#B5EAD7" opacity="0.6"/>
</svg>
