<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- GOLDEN TWIN TAILS — high pigtails with long flowing tails -->

  <!-- Left tail (goes far down left side) -->
  <path d="M 48 90 Q 20 120 16 180 Q 14 220 24 250 Q 34 268 44 260 Q 52 246 46 220 Q 40 190 48 160 Q 54 130 60 100 Z" fill="#F0C840"/>
  <path d="M 48 90 Q 30 120 26 180 Q 24 220 34 250 Q 38 256 44 256 Q 50 248 46 220 Q 40 190 50 160 Q 56 130 64 102 Z" fill="#E8B820" opacity="0.5"/>

  <!-- Right tail -->
  <path d="M 152 90 Q 180 120 184 180 Q 186 220 176 250 Q 166 268 156 260 Q 148 246 154 220 Q 160 190 152 160 Q 146 130 140 100 Z" fill="#F0C840"/>
  <path d="M 152 90 Q 170 120 174 180 Q 176 220 166 250 Q 162 256 156 256 Q 150 248 154 220 Q 160 190 150 160 Q 144 130 136 102 Z" fill="#E8B820" opacity="0.5"/>

  <!-- Crown / top hair mass -->
  <ellipse cx="100" cy="22" rx="60" ry="20" fill="#F0C840"/>

  <!-- Main hair back -->
  <ellipse cx="100" cy="60" rx="62" ry="56" fill="#F0C840"/>

  <!-- Left tie base (where tail starts, at temple) -->
  <circle cx="50" cy="88" r="12" fill="#F0C840"/>
  <circle cx="50" cy="88" r="8"  fill="#FFD0D0"/>
  <circle cx="50" cy="88" r="5"  fill="#FF8080"/>

  <!-- Right tie base -->
  <circle cx="150" cy="88" r="12" fill="#F0C840"/>
  <circle cx="150" cy="88" r="8"  fill="#FFD0D0"/>
  <circle cx="150" cy="88" r="5"  fill="#FF8080"/>

  <!-- Fringe/bangs -->
  <path d="M 46 44 Q 66 22 100 18 Q 134 18 154 40 Q 140 52 118 52 Q 94 54 68 56 Q 56 60 48 68 Q 42 60 46 44 Z" fill="#F0C840"/>

  <!-- Fringe shadow -->
  <path d="M 56 52 Q 82 36 118 36 Q 140 40 152 50 Q 136 58 116 58 Q 86 60 64 64 Z" fill="#E8B820" opacity="0.4"/>

  <!-- Hair highlight -->
  <path d="M 74 14 Q 80 30 76 52" fill="none" stroke="#FFF0B0" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 98 12 Q 102 28 100 48" fill="none" stroke="#FFF0B0" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
