<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- PINK BOB — chin-length, blunt cut, with side-swept fringe -->

  <!-- Back hair mass -->
  <ellipse cx="100" cy="68" rx="62" ry="66" fill="#FF80A0"/>

  <!-- Hair sides — left drop to chin -->
  <path d="M 42 82 Q 36 100 38 126 Q 50 132 58 128 Q 55 106 52 88 Z" fill="#FF6090"/>
  <!-- Hair sides — right drop to chin -->
  <path d="M 158 82 Q 164 100 162 126 Q 150 132 142 128 Q 145 106 148 88 Z" fill="#FF6090"/>

  <!-- Hair bottom edge (blunt cut line) -->
  <path d="M 42 125 Q 100 134 158 125 L 158 128 Q 100 138 42 128 Z" fill="#FF6090"/>

  <!-- Top/crown coverage -->
  <ellipse cx="100" cy="22" rx="58" ry="18" fill="#FF80A0"/>

  <!-- Fringe (bangs) — side-swept right -->
  <path d="M 44 46 Q 62 28 100 24 Q 134 22 152 40 Q 138 50 120 50 Q 96 52 72 56 Q 58 60 50 68 Q 42 62 44 46 Z" fill="#FF80A0"/>

  <!-- Fringe inner detail / shadow -->
  <path d="M 54 54 Q 80 42 120 42 Q 140 44 152 52 Q 138 58 118 58 Q 88 60 62 66 Z" fill="#FF6090" opacity="0.5"/>

  <!-- Hair highlight streak -->
  <path d="M 72 18 Q 78 30 74 52" fill="none" stroke="#FFB0C8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 96 14 Q 100 26 98 46" fill="none" stroke="#FFB0C8" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
</svg>
