<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- EAR LEFT -->
  <ellipse cx="44" cy="82" rx="12" ry="16" fill="#FFE0C8"/>
  <ellipse cx="44" cy="82" rx="8"  ry="11" fill="#F5C0A8"/>
  <!-- EAR RIGHT -->
  <ellipse cx="156" cy="82" rx="12" ry="16" fill="#FFE0C8"/>
  <ellipse cx="156" cy="82" rx="8"  ry="11" fill="#F5C0A8"/>

  <!-- HEAD -->
  <ellipse cx="100" cy="80" rx="58" ry="66" fill="#FFE0C8"/>

  <!-- EYEBROWS -->
  <path d="M 74 60 Q 80 56 87 60" fill="none" stroke="#C89070" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 113 60 Q 120 56 126 60" fill="none" stroke="#C89070" stroke-width="2.5" stroke-linecap="round"/>

  <!-- EYES -->
  <!-- Eye sclera left -->
  <ellipse cx="82" cy="80" rx="12" ry="12" fill="white"/>
  <!-- Iris left -->
  <ellipse cx="82" cy="82" rx="9"  ry="9"  fill="#7B4FB8"/>
  <!-- Pupil left -->
  <ellipse cx="82" cy="84" rx="5"  ry="5"  fill="#3A1A60"/>
  <!-- Shine left -->
  <circle cx="86" cy="77" r="3.5"  fill="white"/>
  <circle cx="78" cy="82" r="1.5"  fill="white"/>
  <!-- Lashes left -->
  <line x1="72" y1="71" x2="69" y2="66" stroke="#3A1A60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="69" x2="75" y2="64" stroke="#3A1A60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="82" y1="68" x2="82" y2="63" stroke="#3A1A60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="88" y1="69" x2="90" y2="65" stroke="#3A1A60" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Eye sclera right -->
  <ellipse cx="118" cy="80" rx="12" ry="12" fill="white"/>
  <!-- Iris right -->
  <ellipse cx="118" cy="82" rx="9"  ry="9"  fill="#7B4FB8"/>
  <!-- Pupil right -->
  <ellipse cx="118" cy="84" rx="5"  ry="5"  fill="#3A1A60"/>
  <!-- Shine right -->
  <circle cx="122" cy="77" r="3.5"  fill="white"/>
  <circle cx="114" cy="82" r="1.5"  fill="white"/>
  <!-- Lashes right -->
  <line x1="108" y1="71" x2="105" y2="66" stroke="#3A1A60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="112" y1="69" x2="111" y2="64" stroke="#3A1A60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="118" y1="68" x2="118" y2="63" stroke="#3A1A60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="124" y1="69" x2="126" y2="65" stroke="#3A1A60" stroke-width="1.5" stroke-linecap="round"/>

  <!-- BLUSH -->
  <ellipse cx="68"  cy="100" rx="16" ry="9" fill="#FFB7C5" opacity="0.65"/>
  <ellipse cx="132" cy="100" rx="16" ry="9" fill="#FFB7C5" opacity="0.65"/>

  <!-- NOSE (tiny dot) -->
  <circle cx="100" cy="98" r="2" fill="#F5A888"/>

  <!-- MOUTH -->
  <path d="M 90 112 Q 100 121 110 112" fill="none" stroke="#E87898" stroke-width="2.8" stroke-linecap="round"/>
  <!-- tiny teeth hint -->
  <path d="M 93 113 Q 100 117 107 113" fill="white" stroke="none"/>
</svg>
